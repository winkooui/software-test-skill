      - "v2.2 版本新增此用例"

  - id: TC_CREATED_BY
    name: "创建人"
    group: meta
    type: string
    required: false
    description: "用例创建者"

  - id: TC_CREATED_DATE
    name: "创建日期"
    group: meta
    type: string
    required: false
