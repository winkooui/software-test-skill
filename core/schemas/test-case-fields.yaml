# ============================================================================
# 字段完整性检查清单
# 生成或审查用例时必须逐项检查
# ============================================================================

completeness_checklist:
  - check: "每条用例都有唯一且格式正确的编号"
    severity: error
  - check: "每条用例都已分配优先级（P0-P3）"
    severity: error
  - check: "每条用例名称长度 ≤ 80 字符，语义清晰"
    severity: warning
  - check: "前置条件具体可验证，无模糊描述"
    severity: warning
  - check: "测试步骤编号连续，每步可独立执行"
    severity: error
  - check: "测试数据字段有具体值，无 '有效数据' 等模糊描述"
    severity: warning
  - check: "预期结果与测试步骤可逐条对应验证"
    severity: error
  - check: "P0 用例标记了所有环境为适用环境"
    severity: warning
  - check: "回归用例的相近度等级与回归深度对等"
    severity: error
  - check: "用户视角用例标注了标签和用户画像"
    severity: warning
