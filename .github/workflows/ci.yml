name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate schemas and examples
        run: python scripts/validate_schema.py --root .

      - name: Evaluate sample quality
        run: python scripts/evaluate_quality.py --input examples/sample-test-cases.csv --min-score 75

      - name: Run tests
        run: python -m unittest discover -s tests -v
